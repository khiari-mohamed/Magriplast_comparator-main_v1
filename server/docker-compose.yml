version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  worker_cpu:
    build: .
    command: celery -A app.core.celery_app.celery_app worker -Q pdf_processing -c 4 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres

  worker_llm:
    build: .
    command: celery -A app.core.celery_app.celery_app worker -Q llm_tasks -c 10 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: magriplast
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: magriplast
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: